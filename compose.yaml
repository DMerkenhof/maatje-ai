services:
  maatje-ai:
    build: .
    container_name: maatje-ai
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - PORT=3080
      - TZ=Europe/Amsterdam
    volumes:
      # Alles wat bewaard moet blijven staat in ./data (gesprekken, memory, skills, MCP-logins).
      - ./data:/data
    ports:
      # Alleen bereikbaar op deze computer zelf. Via Tailscale maak je hem veilig bereikbaar
      # op je andere apparaten (zie README). Andere poort nodig? Zet APP_PORT in .env.
      - "127.0.0.1:${APP_PORT:-3080}:3080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
